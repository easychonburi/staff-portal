  <script>
    /* ---------------- State ---------------- */
    let currentBranch = '';
    let currentMode = '';
    let stockData = {};
    let orderRequests = {};
    let currentConfirmItem = '';
    let customOrders = [];
    window.currentAction = null; 
    window.currentCheckbox = null; 

    /* ---------------- Config helpers ---------------- */
    const FRACTIONS = ['', '1/4', '1/2', '3/4']; 
    const WHOLE_MAX = 6; 

    function numericOnly(inp, allowDecimal = true) {
      let v = String(inp.value || '');
      v = v.replace(/[^\d.]/g, '');
      if (allowDecimal) {
        const parts = v.split('.');
        if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
      } else {
        v = v.replace(/\./g, '');
      }
      if (v.startsWith('.')) v = '0' + v;
      inp.value = v;
    }

    function hashId(name) {
      let hash = 0x811c9dc5;
      for (const ch of String(name)) {
        hash ^= ch.codePointAt(0);
        hash = (hash >>> 0) * 16777619 >>> 0;
      }
      return 'orderBtn-' + hash.toString(16);
    }
    function btnIdForItem(name){ return hashId(name); }

    function getOrderBtnHTML(name){
      const id = btnIdForItem(name);
      const ordered = !!orderRequests[name];
      const base = 'px-3 py-2 rounded-lg text-sm font-bold border-2 border-black shadow-[0_3px_0_rgba(0,0,0,0.1)] active:translate-y-[3px] active:shadow-none transition-all';
      const cls = ordered
        ? 'bg-easy-green text-white ' + base
        : 'bg-easy-yellow text-black ' + base;
      const label = ordered ? 'สั่งแล้ว ✅' : 'สั่งเพิ่ม';
      return `<button id="${id}" data-item="${name}" onclick="requestOrder('${name}')" class="${cls}">${label}</button>`;
    }
    function refreshOrderButtonState(name){
      const btn = document.getElementById(btnIdForItem(name));
      if (!btn) return;
      const ordered = !!orderRequests[name];
      btn.className = (ordered
        ? 'bg-easy-green text-white '
        : 'bg-easy-yellow text-black ')
        + 'px-3 py-2 rounded-lg text-sm font-bold border-2 border-black shadow-[0_3px_0_rgba(0,0,0,0.1)] active:translate-y-[3px] active:shadow-none transition-all';
      btn.textContent = ordered ? 'สั่งแล้ว ✅' : 'สั่งเพิ่ม';
    }

        { name:'กล่อง 26 oz', unit:'แถว', category:'packaging', icon:'📦', type:'fraction' },
        { name:'กล่อง 32 oz', unit:'แถว', category:'packaging', icon:'📦', type:'fraction' },
        { name:'ถุงหิ้วพลาสติก 6×14', unit:'ห่อ', category:'packaging', icon:'📦', type:'fraction' },
        { name:'ถุงหิ้วพลาสติก 8×16', unit:'ห่อ', category:'packaging', icon:'📦', type:'fraction' },
        { name:'สติ๊กเกอร์ ดั้งเดิม', unit:'แผ่น', category:'packaging', icon:'📦', type:'fraction' },
        { name:'สติ๊กเกอร์ แซ่บ', unit:'แผ่น', category:'packaging', icon:'📦', type:'fraction' },
        { name:'น้ำเปล่า',   unit:'ขวด', category:'packaging', icon:'📦', type:'free' },
        { name:'น้ำโค้ก',    unit:'ขวด', category:'packaging', icon:'📦', type:'free' },
        { name:'น้ำส้ม',     unit:'ขวด', category:'packaging', icon:'📦', type:'free' },
        { name:'น้ำแดง',     unit:'ขวด', category:'packaging', icon:'📦', type:'free' },
        { name:'น้ำสไปร์ท',  unit:'ขวด', category:'packaging', icon:'📦', type:'free' },
        { name:'น้ำเก๊กฮวย', unit:'ขวด', category:'packaging', icon:'📦', type:'free' },
        { name:'น้ำอัญชัน',  unit:'ขวด', category:'packaging', icon:'📦', type:'free' },
        { name:'ชาไทย',      unit:'ขวด', category:'packaging', icon:'📦', type:'free' },
        ...packagingReceipts,
        { name:'ตะเกียบ', unit:'', category:'packaging', icon:'📦', orderOnly:true },

        { name:'ถุงขยะ', unit:'', category:'cleaning', icon:'🧹', orderOnly:true },
        { name:'ทิชชู่เปียก', unit:'', category:'cleaning', icon:'🧹', orderOnly:true },
        { name:'ทิชชู่แห้ง', unit:'', category:'cleaning', icon:'🧹', orderOnly:true },
        { name:'น้ำยาถูพื้น', unit:'', category:'cleaning', icon:'🧹', orderOnly:true },
        { name:'น้ำยาซักผ้า', unit:'', category:'cleaning', icon:'🧹', orderOnly:true },
        { name:'น้ำยาล้างจาน', unit:'', category:'cleaning', icon:'🧹', orderOnly:true },
        { name:'ฟองน้ำล้างจาน', unit:'', category:'cleaning', icon:'🧹', orderOnly:true },
        { name:'ถุงมือ', unit:'', category:'cleaning', icon:'🧹', orderOnly:true },
        { name:'หมวกคลุมผม', unit:'', category:'cleaning', icon:'🧹', orderOnly:true },
      ];
    }

    /* ---------------- Navigation ---------------- */
    function selectBranch(branch){
      currentBranch = branch;
      document.getElementById('selectedBranch').textContent = branch;
      showScreen('modeScreen');
    }

    function selectMode(mode){
      currentMode = mode;
      let text = '';
      if (mode === 'open') {
        text = (currentBranch === 'หนองตำลึง') ? 'เช็คเฉพาะสิ่งที่ทำแล้ว' : '☀️ โหมดเปิดร้าน';
      } else {
        text = '🌙 โหมดปิดร้าน';
      }
      document.getElementById('modeText').textContent = text;
      loadStockItems();
      showScreen('stockScreen');
    }

    function showScreen(id){
      ['branchScreen','modeScreen','stockScreen','summaryScreen'].forEach(s => {
        document.getElementById(s).classList.add('hidden');
      });
      document.getElementById(id).classList.remove('hidden');
      window.scrollTo(0,0);
    }
    function goBack(id){ showScreen(id); }

    /* ---------------- Render items ---------------- */
    function loadStockItems(){
      const container = document.getElementById('stockItems');
      container.innerHTML = '';
      stockData = {}; orderRequests = {}; customOrders = [];

      if (currentMode === 'close') {
        const items = closeModeItemsForBranch(currentBranch);
        const categories = {
          fresh:     { name:'หมวดวัตถุดิบสด', icon:'🥬', items:[] },
          seasoning: { name:'หมวดเครื่องปรุง', icon:'🧂', items:[] },
          packaging: { name:'หมวดบรรจุภัณฑ์ + น้ำ', icon:'📦', items:[] },
          cleaning:  { name:'หมวดทำความสะอาด', icon:'🧹', items:[] },
        };
        items.forEach(it => categories[it.category].items.push(it));

        Object.values(categories).forEach(cat => {
          if (cat.items.length === 0) return;
          const wrap = document.createElement('div');
          wrap.className = 'mb-6';
          wrap.innerHTML = `
            <div class="flex items-center mb-3 px-2">
              <span class="text-2xl mr-2">${cat.icon}</span>
              <h3 class="text-xl font-bold text-gray-800">${cat.name}</h3>
            </div>
          `;
          cat.items.forEach(it => wrap.appendChild(createItemElement(it)));
          container.appendChild(wrap);
        });

        // สั่งอื่นๆเพิ่ม
        const customDiv = document.createElement('div');
        customDiv.className = 'mb-6';
        customDiv.innerHTML = `
          <div class="flex items-center mb-3 px-2">
            <span class="text-2xl mr-2">📝</span>
            <h3 class="text-xl font-bold text-gray-800">สั่งอื่นๆเพิ่ม</h3>
          </div>
          <div class="bg-white rounded-[16px] p-4 border-2 border-black shadow-[0_4px_0_rgba(0,0,0,0.1)]">
            <div class="space-y-3">
              <div class="flex items-center space-x-3">
                <input type="text" id="customItemName" class="flex-1 px-3 py-3 easy-input font-medium"
                  placeholder="เช่น โพสอิท สก๊อตเทป"
                  onkeypress="if(event.key==='Enter') addCustomOrder()">
                <button onclick="addCustomOrder()" class="bg-easy-green text-white px-4 py-3 rounded-xl font-bold border-2 border-black shadow-[0_3px_0_rgba(0,0,0,0.1)] active:translate-y-[3px] active:shadow-none">เพิ่ม</button>
              </div>
              <div id="customOrdersList" class="space-y-2 mt-2"></div>
            </div>
          </div>
        `;
        container.appendChild(customDiv);
      } else {
        const items = openModeItemsForBranch(currentBranch);
        items.forEach(it => container.appendChild(createItemElement({ ...it })));
      }
      updateProgress();
    }

    function createItemElement(item){
      const div = document.createElement('div');
      div.className = 'bg-white rounded-[16px] p-4 mb-3 border-2 border-black shadow-[0_4px_0_rgba(0,0,0,0.1)]';

      if (item.orderOnly) {
        div.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex-1">
              <h4 class="font-bold text-lg text-gray-800">${item.name}</h4>
              <p class="text-sm text-gray-500 font-medium">ติ๊กเพื่อสั่งเพิ่ม</p>
            </div>
            <label class="flex items-center cursor-pointer">
              <input type="checkbox" class="w-6 h-6 text-easy-red border-2 border-gray-300 rounded focus:ring-easy-red focus:ring-2" onchange="toggleOrderRequest('${item.name}', this.checked, this)">
              <span class="ml-2 font-bold text-gray-700">สั่งเพิ่ม</span>
            </label>
          </div>
        `;
        return div;
      }

      if (item.type === 'fraction') {
        div.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <h4 class="font-bold text-lg text-gray-800">${item.name}</h4>
            ${currentMode === 'close' ? getOrderBtnHTML(item.name) : ''}
          </div>
          <div class="flex items-center space-x-2">
            <select class="w-20 px-2 py-2 easy-input text-center font-bold text-lg"
              onchange="updateFractionStock('${item.name}', this)">
              ${Array.from({length: WHOLE_MAX+1}, (_,i)=>`<option value="${i}">${i}</option>`).join('')}
            </select>
            <select class="w-20 px-2 py-2 easy-input text-center font-bold text-lg"
              onchange="updateFractionStock('${item.name}', this)">
              ${FRACTIONS.map(fr => `<option value="${fr}">${fr || '-'}</option>`).join('')}
            </select>
            <span class="text-gray-600 font-medium ml-1">${item.unit}</span>
          </div>
        `;
        return div;
      }

      if (item.type === 'number') {
        div.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <h4 class="font-bold text-lg text-gray-800">${item.name}</h4>
            ${currentMode === 'close' ? getOrderBtnHTML(item.name) : ''}
          </div>
          <div class="flex items-center space-x-2">
            <input type="number" min="0" max="${WHOLE_MAX}" step="1"
              class="w-24 px-3 py-2 easy-input text-center font-bold text-lg"
              placeholder="0" oninput="clampNumber(this)" onchange="updateStock('${item.name}', this.value)">
            <span class="text-gray-600 font-medium ml-1">${item.unit}</span>
          </div>
        `;
        return div;
      }

      if (item.type === 'free') {
        div.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <h4 class="font-bold text-lg text-gray-800">${item.name}</h4>
            ${currentMode === 'close' ? getOrderBtnHTML(item.name) : ''}
          </div>
          <div class="flex items-center space-x-2">
            <input type="text" inputmode="decimal" placeholder="0"
              class="w-24 px-3 py-2 easy-input text-center font-bold text-lg"
              oninput="numericOnly(this, true); updateStock('${item.name}', this.value)"
              onchange="numericOnly(this, true); updateStock('${item.name}', this.value)">
            <span class="text-gray-600 font-medium ml-1">${item.unit}</span>
          </div>
        `;
        return div;
      }

      return div;
    }

    function clampNumber(inp){
      const v = parseInt(inp.value || '0', 10);
      if (isNaN(v) || v < 0) inp.value = 0;
      else if (v > WHOLE_MAX) inp.value = WHOLE_MAX;
    }

    function updateFractionStock(itemName, el){
      const parent = el.parentNode;
      const selects = parent.querySelectorAll('select');
      if (selects.length === 2){
        const whole = selects[0].value;
        const frac  = selects[1].value;
        let val = whole;
        if (frac && whole !== '0') val = `${whole} ${frac}`;
        else if (frac && whole === '0') val = frac;
        stockData[itemName] = val || '';
        updateProgress();
      }
    }

    function updateStock(name, value){
      stockData[name] = value || '';
      updateProgress();
    }

    /* ---------------- Order controls ---------------- */
    function toggleOrderRequest(itemName, checked, checkbox){
      if (checked) {
        currentConfirmItem = itemName;
        document.getElementById('confirmModalTitle').textContent = 'ต้องการสั่งรายการนี้เพิ่มใช่ไหม?';
        document.getElementById('confirmItemName').textContent = itemName;
        document.getElementById('confirmItemName').className = 'text-2xl font-extrabold text-easy-red tracking-wide mb-6';
        window.currentAction = 'add';
        window.currentCheckbox = checkbox;
        document.getElementById('confirmModal').classList.remove('hidden');
      } else {
        delete orderRequests[itemName];
        updateProgress();
      }
    }

    function requestOrder(itemName){
      currentConfirmItem = itemName;
      const isOrdered = !!orderRequests[itemName];
      document.getElementById('confirmModalTitle').textContent = isOrdered ? 'ยกเลิกการสั่งรายการนี้ใช่ไหม?' : 'ต้องการสั่งรายการนี้เพิ่มใช่ไหม?';
      document.getElementById('confirmItemName').textContent = itemName;
      document.getElementById('confirmItemName').className = 'text-2xl font-extrabold tracking-wide mb-6 ' + (isOrdered ? 'text-gray-500' : 'text-easy-red');
      window.currentAction = isOrdered ? 'remove' : 'add';
      document.getElementById('confirmModal').classList.remove('hidden');
    }

    function confirmOrder(){
      const item = currentConfirmItem;
      if (window.currentAction === 'remove') delete orderRequests[item];
      else orderRequests[item] = true;
      refreshOrderButtonState(item);
      updateProgress();
      closeModal();
    }

    function closeModal(){
      const item = currentConfirmItem;
      document.getElementById('confirmModal').classList.add('hidden');
      if (window.currentCheckbox && window.currentAction === 'add' && !orderRequests[item]) {
        window.currentCheckbox.checked = false;
      }
      window.currentCheckbox = null; currentConfirmItem = ''; window.currentAction = null;
    }

    /* ---------------- Progress ---------------- */
    function updateProgress(){
      const items = currentMode === 'open' ? openModeItemsForBranch(currentBranch) : closeModeItemsForBranch(currentBranch);
      let completed = 0;
      items.forEach(it => {
        if (it.orderOnly) completed++;
        else if (stockData[it.name] && stockData[it.name] !== '') completed++;
      });
      const pct = Math.round((completed / items.length) * 100);
      document.getElementById('progressText').textContent = pct + '%';
      document.getElementById('progressBar').style.width = pct + '%';
    }

    /* ---------------- Save / Summary / Telegram ---------------- */
    function saveStock(){
      if (currentMode === 'open') confirmSaveStock();
      else { showOrderSummary(); showScreen('summaryScreen'); }
    }

    function showOrderSummary(){
      const wrap = document.getElementById('orderSummaryList');
      wrap.innerHTML = '';
      const list = Object.keys(orderRequests).filter(n => orderRequests[n]);
      if (customOrders.length) list.push(...customOrders.map(o=>o.name));

      if (list.length === 0) {
        wrap.innerHTML = `<div class="text-center py-6 text-gray-500 font-medium"><div class="text-4xl mb-2">🤷‍♂️</div><p>ไม่มีรายการสั่งเพิ่ม</p></div>`;
        return;
      }
      list.forEach((name, i) => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between p-3 border-b-2 border-gray-100 last:border-0';
        row.innerHTML = `
          <div class="flex items-center">
            <span class="w-8 h-8 bg-easy-yellow text-black border-2 border-black rounded-full flex items-center justify-center font-bold mr-3">${i+1}</span>
            <span class="font-bold text-gray-800 text-lg">${name}</span>
          </div>
          <span class="text-easy-green font-extrabold">✓</span>
        `;
        wrap.appendChild(row);
      });
    }

    function confirmSaveStock(){
      const now = new Date();
      const report = {
        branch: currentBranch,
        mode: currentMode,
        date: now.toLocaleDateString('th-TH'),
        time: now.toLocaleTimeString('th-TH'),
        progress: parseInt(document.getElementById('progressText').textContent) || 0,
        stocks: buildStocksPayload(),
        orders: buildOrdersPayload(),
      };

      // 1. ส่งเข้า Telegram (ฟังก์ชันเดิมใน netlify)
      fetch('/api/telegram', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify(report)
      }).catch(()=>{});

      // 2. ส่งใบสั่งของเข้า Google Sheet (ทำงานร่วมกับแอปคนขับ)
      if (report.orders && report.orders.length > 0) {
        const API_URL = "https://script.google.com/macros/s/AKfycbz4BHw3tzcFThiI2ip5bh0cBkEJxjS_0RW5L7oIICQmgUDccN_hdPnaV6NzekX9VYH-/exec";
        const sheetPayload = {
          action: "saveOrders",
          branch: currentBranch,
          orders: report.orders
        };
        fetch(API_URL, { method: "POST", body: JSON.stringify(sheetPayload) })
        .catch(err => console.error("Sheet Error:", err));
      }

      document.getElementById('successModal').classList.remove('hidden');
    }

    function buildStocksPayload(){
      const allItems = currentMode === 'open' ? openModeItemsForBranch(currentBranch) : closeModeItemsForBranch(currentBranch);
      const names = new Set(allItems.filter(i => !i.orderOnly).map(i => i.name));
      return Object.entries(stockData)
        .filter(([name,val]) => names.has(name) && val && String(val).trim() !== '')
        .map(([name,val]) => {
          const unit = (allItems.find(i => i.name === name) || {}).unit || '';
          return { name, value: val, unit };
        });
    }

    function buildOrdersPayload(){
      const listed = Object.keys(orderRequests).filter(n => orderRequests[n]);
      if (customOrders.length) listed.push(...customOrders.map(o=>o.name));
      return listed;
    }

    /* ---------------- Custom orders ---------------- */
    function addCustomOrder(){
      const inp = document.getElementById('customItemName');
      const name = (inp.value || '').trim();
      if (!name) { alert('กรุณากรอกชื่อรายการ'); return; }
      if (customOrders.some(o => o.name === name)) { alert('รายการนี้มีอยู่แล้ว'); return; }
      const item = { id: Date.now(), name };
      customOrders.push(item);
      orderRequests[name] = true;
      inp.value = '';
      updateCustomOrdersList();
      updateProgress();
    }
    function removeCustomOrder(id){
      const idx = customOrders.findIndex(o => o.id === id);
      if (idx !== -1){
        const name = customOrders[idx].name;
        delete orderRequests[name];
        customOrders.splice(idx, 1);
        updateCustomOrdersList();
        updateProgress();
      }
    }
    function updateCustomOrdersList(){
      const wrap = document.getElementById('customOrdersList');
      if (!wrap) return;
      wrap.innerHTML = '';
      customOrders.forEach(o => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between bg-white p-3 rounded-xl border-2 border-black shadow-[0_2px_0_rgba(0,0,0,0.1)]';
        row.innerHTML = `
          <div class="flex-1"><span class="font-bold text-gray-800">${o.name}</span></div>
          <button onclick="removeCustomOrder(${o.id})" class="text-easy-red font-extrabold px-2">ลบ ✕</button>`;
        wrap.appendChild(row);
      });
    }

    // เริ่มต้นที่หน้าเลือกสาขา
    showScreen('branchScreen');
  </script>
</body>
</html>
